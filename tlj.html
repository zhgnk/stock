<script>'use strict';
const Rules = (() => {
  const SUITS = ['♠', '♥', '♣', '♦'];
  const SUIT_NAMES = ['黑桃', '红桃', '梅花', '方块'];
  const deck = () => Array.from({ length: 108 }, (_, id) => id);
  const face = id => id % 54;
  const suit = id => face(id) >= 52 ? -1 : Math.floor(face(id) / 13);
  const rank = id => face(id) >= 52 ? face(id) - 37 : face(id) % 13 + 2;
  const hard = id => rank(id) <= 3 || rank(id) >= 15;
  const group = (id, trump) => hard(id) || suit(id) === trump ? 4 : suit(id);
  const level = (id, trump) => {
    const r = rank(id);
    if (r >= 15) return r + 4;
    if (r === 3) return suit(id) === trump ? 18 : 17;
    if (r === 2) return suit(id) === trump ? 16 : 15;
    return r;
  };
  const value = id => rank(id) === 5 ? 5 : [10, 13].includes(rank(id)) ? 10 : 0;
  const points = cards => cards.reduce((sum, id) => sum + value(id), 0);
  const label = id => rank(id) === 16 ? '大王' : rank(id) === 15 ? '小王' : SUITS[suit(id)] + ({ 11: 'J', 12: 'Q', 13: 'K', 14: 'A' }[rank(id)] || rank(id));
  const shortRank = id => ({ 11: 'J', 12: 'Q', 13: 'K', 14: 'A', 15: '小王', 16: '大王' }[rank(id)] || String(rank(id)));
  const byPower = trump => (a, b) => level(b, trump) - level(a, trump) || face(a) - face(b) || a - b;
  function sortHand(cards, trump) {
    const colors = [1, 0, 3, 2];
    const first = Math.max(0, colors.indexOf(trump));
    const suits = [...colors.slice(first), ...colors.slice(0, first)];
    const groups = [4, ...suits.filter(s => s !== trump)];
    return cards.slice().sort((a, b) => groups.indexOf(group(a, trump)) - groups.indexOf(group(b, trump))
      || level(b, trump) - level(a, trump) || suits.indexOf(suit(a)) - suits.indexOf(suit(b)) || face(a) - face(b) || a - b);
  }
  const remove = (cards, chosen) => { const ids = new Set(chosen); return cards.filter(id => !ids.has(id)); };
  const pairs = cards => {
    const map = new Map();
    cards.forEach(id => { const f = face(id); if (!map.has(f)) map.set(f, []); map.get(f).push(id); });
    return [...map.values()].filter(list => list.length === 2);
  };
  function seeded(seed) {
    let state = seed >>> 0;
    return () => { state += 0x6D2B79F5; let x = state; x = Math.imul(x ^ x >>> 15, x | 1); x ^= x + Math.imul(x ^ x >>> 7, x | 61); return ((x ^ x >>> 14) >>> 0) / 4294967296; };
  }

    const result = cards.slice();
    for (let i = result.length - 1; i > 0; i--) { const j = Math.floor(random() * (i + 1)); [result[i], result[j]] = [result[j], result[i]]; }
    return result;
  }
  function describe(cards, trump) {
    if (!cards.length) return null;
    const g = group(cards[0], trump);

  function showSettings() {
    const select = (key, choices) => `<select name="${key}">${choices.map(([value, text]) => `<option value="${value}" ${String(config[key]) === String(value) ? 'selected' : ''}>${text}</option>`).join('')}</select>`;
    modal('牌桌设置', `<form id="settings-form"><div class="setting-row"><label>机器人思考</label>${select('difficulty', [['quick', '迅速'], ['expert', '专家'], ['deep', '深思']])}</div><div class="setting-row"><label for="speed">接牌间隔</label><input id="speed" name="dealSpeed" type="range" min="70" max="450" step="10" value="${config.dealSpeed}" aria-label="接牌间隔"></div></form>`, '<button class="btn" data-action="close-modal">取消</button><button class="btn primary" data-action="save-settings">保存设置</button>');
  }
  document.addEventListener('click', event => {
    const card = event.target.closest('[data-card]');
    if (card) {
      const editable = !state.auto && ((state.phase === 'play' && state.turn === 0) || (state.phase === 'bury' && state.dealer === 0));
      if (!editable) return;
      const id = Number(card.dataset.card);
      if (selected.has(id)) selected.delete(id); else selected.add(id);
      renderHand(); renderDecision(); return;
    }
    const declaration = event.target.closest('[data-declare]');
    if (declaration && !state.auto) { declare(0, Number(declaration.dataset.declare), declaration.dataset.pair === 'true'); return; }
    const button = event.target.closest('[data-action]');
    if (!button || button.disabled) return;
    const action = button.dataset.action;
    if (action === 'pause') { state.paused = !state.paused; save(); render(); pump(); }
    else if (action === 'fast-deal') { clearTimeout(timer); while (state.phase === 'deal') dealOne(true); render(); save(); pump(); }
    else if (action === 'finish-deal') finishDealing();
    else if (action === 'bid') { if (!bid(0, Number($('bid-input')?.value))) toast('报价须为 10 的倍数，高于当前报价，最高 200 分；弃叫后不能再加'); }
    else if (action === 'pass-bid') bid(0, 0);
    else if (action === 'bury') bury(0, [...selected]);
    else if (action === 'play') play(0, [...selected]);
    else if (action === 'clear') { selected.clear(); renderHand(); renderDecision(); }
    else if (action === 'hint') askBot(0, state.phase === 'bury' ? 'bury' : 'play', true);
    else if (action === 'auto') { state.auto = !state.auto; selected.clear(); if (!state.auto) { jobSerial++; busy = false; } state.paused = false; save(); render(); pump(); }
    else if (action === 'rules') showRules();
    else if (action === 'settings') showSettings();
    else if (action === 'save-settings') {
      const form = $('settings-form');
      config = { dealSpeed: Number(form.elements.dealSpeed.value), difficulty: form.elements.difficulty.value };
      write('tractor-config-v1', config); $('modal').close(); toast('设置已保存'); pump();
    } else if (action === 'history') showHistory();
    else if (action === 'last') showHistory(true);
    else if (action === 'bottom') { if (state.dealer === 0 || state.phase === 'end') modal('底牌', `<div class="bottom-cards">${state.bottom.map(id => cardHTML(id, { played: true })).join('')}</div><p class="bottom-caption">${R.points(state.bottom)} 分</p>`); }
    else if (action === 'restart') modal('重新开局', '<p>结束当前牌局，重新随机决定首家接牌者。</p>', '<button class="btn" data-action="close-modal">取消</button><button class="btn primary" data-action="confirm-restart">重新开局</button>');
    else if (action === 'confirm-restart') newRound(true);
    else if (action === 'next') newRound(false);
    else if (action === 'result') showResult();
    else if (action === 'close-modal') $('modal').close();
  });
  document.addEventListener('dblclick', event => {
    const card = event.target.closest('[data-card]');
    if (!card || state.auto || state.phase !== 'play' || state.turn !== 0) return;
    const id = Number(card.dataset.card), copies = state.hands[0].filter(x => R.face(x) === R.face(id));
    copies.forEach(x => selected.add(x)); renderHand(); renderDecision();
  });
  let resizeTimer;
  addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(render, 80); });
  addEventListener('beforeunload', save);
  $('rules-icon').innerHTML = icon('BookOpen'); $('settings-icon').innerHTML = icon('Settings'); $('restart-icon').innerHTML = icon('RotateCcw'); $('history-icon').innerHTML = icon('History'); $('close-icon').innerHTML = icon('X');
  globalThis.TractorGame = { get state() { return state; }, makeView, play, bid, bury, declare, dealOne, finishDealing, collect, newRound, render, setState(value) { cancelWork(); state = value; selected.clear(); render(); save(); pump(); }, select(ids) { selected = new Set(ids); render(); } };
  if (!state) { newRound(true); if (previousRulesSave) toast('规则已更新，重新接牌；累计战绩已保留'); } else { render(); pump(); }
})();
</script>
</body>
